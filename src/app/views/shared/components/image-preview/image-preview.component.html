<a class="image-preview-trigger" data-fancybox="gallery" data-type="image" [attr.data-caption]="title" [href]="previewUrl" [attr.aria-label]="'Ampliar imagen de ' + (title || 'producto')">
  <img class="image-preview-thumbnail" [class.me-2]="width === null" [src]="thumbnailUrl" (error)="onImageError($event)" [height]="height" [attr.width]="width" [alt]="title || 'Producto'" loading="lazy" decoding="async">
</a>
