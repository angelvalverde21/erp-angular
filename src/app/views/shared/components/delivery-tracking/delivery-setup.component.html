<div class="delivery-collapse" [class.is-open]="form.value.enabled" [attr.aria-hidden]="!form.value.enabled" [attr.inert]="form.value.enabled ? null : ''" id="purchase-delivery-dates">
  <div class="delivery-content">
    <section class="delivery-panel" [formGroup]="form" aria-label="Fechas de entrega">
      <header><i class="fa-regular fa-calendar-check" aria-hidden="true"></i><div><h4>Fechas de entrega</h4><p>Conserva el compromiso y el historial de reprogramaciones.</p></div></header>
      <div class="delivery-setup-fields">
        <label for="purchase-handed-over"><span>Fecha del encargo</span><input id="purchase-handed-over" type="date" formControlName="handed_over_on" [max]="today"><small>Cuándo se hizo el encargo o se entregaron los materiales.</small></label>
        <label for="purchase-expected"><span>Entrega prevista (opcional)</span><input id="purchase-expected" type="date" formControlName="expected_on"><small>Podrás reprogramarla conservando el historial.</small></label>
      </div>
    </section>
  </div>
</div>
