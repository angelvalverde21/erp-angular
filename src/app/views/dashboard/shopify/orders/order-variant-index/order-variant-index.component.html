<div class="order-variants-table-wrap table-responsive">
    <table class="table order-variants-table align-middle mb-0">
        <caption class="visually-hidden">Productos del pedido. Edita la cantidad o el precio para actualizar el total.</caption>
        <thead>
            <tr>
                <th scope="col" class="variant-number-column">#</th>
                <th scope="col">Producto</th>
                <th scope="col" class="text-center variant-quantity-column">Cantidad</th>
                <th scope="col" class="text-end variant-price-column">Precio unitario</th>
                <th scope="col" class="text-end variant-total-column">Importe</th>
                <th scope="col" class="variant-actions-column"><span class="visually-hidden">Acciones</span></th>
            </tr>
        </thead>
        <tbody>
            @for (control of variants.controls; let i = $index; track control) {
            <tr app-order-variant-row [formGroup]="control" [index]="i">
            </tr>
            }
        </tbody>
    </table>
</div>
