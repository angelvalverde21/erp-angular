<ng-container [formGroup]="form">
  <td>
    <div class="entry-product">
      @if (image; as preview) { <app-image-preview [image]="preview" [title]="productName" [height]="58" [width]="46" previewVariant="large" objectFit="contain" /> }
      @else { <span class="entry-image-placeholder" aria-hidden="true"><i class="fa-solid fa-shirt"></i></span> }
      <div class="entry-product-copy">
        <strong>{{ productName }}</strong>
        <small class="entry-sku"><i class="fa-solid fa-barcode" aria-hidden="true"></i>{{ variant.sku || 'Variante #' + variant.id }}</small>
        <div class="entry-options">@for (option of secondaryOptions; track option.id) { <span>{{ option.value }}</span> }</div>
      </div>
    </div>
  </td>
  <td class="entry-quantity-cell"><input type="number" formControlName="quantity" min="1" step="1" inputmode="numeric" placeholder="0" [readonly]="disabled" [attr.aria-label]="'Cantidad para ' + productName + ', ' + (variant.sku || variant.id)" [class.is-invalid]="form.get('quantity')?.dirty && form.get('quantity')?.invalid && form.get('quantity')?.value !== null" (focus)="selectQuantity($event)" (wheel)="$event.preventDefault()"></td>
  <td><select formControlName="comment" [attr.disabled]="disabled ? '' : null" [attr.aria-label]="'Motivo para ' + (variant.sku || productName)">@for (reason of commentOptions; track reason) { <option [value]="reason">{{ commentLabels[reason] || reason }}</option> }</select></td>
  <td class="entry-status-cell"><span class="entry-row-status" [class.included]="selected"><i [class]="selected ? 'fa-solid fa-circle-check' : 'fa-regular fa-circle'" aria-hidden="true"></i>{{ selected ? 'Incluida' : 'Sin cantidad' }}</span></td>
</ng-container>
