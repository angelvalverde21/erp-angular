@if (loading) {
  <div class="purchase-edit-loading" role="status"><app-loading></app-loading><p>Cargando compra…</p></div>
} @else {
  <form class="purchase-editor" [formGroup]="form" (ngSubmit)="update()">
    <fieldset class="purchase-editor-content" [disabled]="loadingIcon">
      @if (error) {
        <div class="purchase-editor-error" role="alert">{{ error }}
          @if (!purchase_items.length) { <button type="button" (click)="purchaseInit()">Reintentar carga</button> }
        </div>
      }
      <section class="purchase-editor-items" aria-label="Conceptos de la compra">
        <app-purchase-item-index [purchase_items]="purchase_items" (emitAddItem)="addItem()"></app-purchase-item-index>
      </section>
      <details class="purchase-editor-options" [open]="detailsInitiallyOpen">
        <summary><span><i class="fa-solid fa-sliders" aria-hidden="true"></i>Datos de la compra<small>Opcional</small></span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></summary>
        <div class="purchase-editor-options-body">
          @if (supplierError) { <p role="alert">{{ supplierError }} <button type="button" (click)="loadSuppliers()">Reintentar</button></p> }
          <app-purchase-form [form]="form" [suppliers]="suppliers" [suppliersLoading]="suppliersLoading" [manageDelivery]="manageDelivery" [deliveryExpanded]="deliveryExpanded" [deliveryTracked]="deliveryTracked" (deliveryRequested)="deliveryRequested.emit()"><ng-content select="[purchase-delivery-panel]" ngProjectAs="[purchase-delivery-panel]" /></app-purchase-form>
        </div>
      </details>
    </fieldset>
    <footer class="purchase-editor-footer">
      <div><small>Total de la compra</small><strong>{{ totalAmount | currency:'PEN':'symbol':'1.2-2':'es-PE' }}</strong></div>
      <div class="purchase-editor-actions">
        <button type="button" class="purchase-editor-cancel" [disabled]="loadingIcon" (click)="cancelled.emit()">Cancelar</button>
        <button type="submit" class="purchase-editor-save" [disabled]="loadingIcon || form.invalid">
          <i class="fa-solid" [class.fa-spinner]="loadingIcon" [class.fa-spin]="loadingIcon" [class.fa-floppy-disk]="!loadingIcon" aria-hidden="true"></i>
          {{ loadingIcon ? 'Guardando…' : 'Guardar cambios' }}
        </button>
      </div>
    </footer>
  </form>
}
