<div [formGroup]="form" class="purchase-details-grid">
  @if (supplier_id !== null) {
    <div class="purchase-detail-field purchase-detail-wide">
      <label for="purchase-supplier"><i class="fa-solid fa-building" aria-hidden="true"></i>Proveedor</label>
      <div class="purchase-supplier-control">
        <app-supplier-selected labelForId="purchase-supplier" formControlName="supplier_id" [suppliers]="suppliers" [loading]="suppliersLoading" />
        <button type="button" class="purchase-supplier-create" [disabled]="suppliersLoading" (click)="openVerticallyCentered(newSupplier)">
          <i class="fa-solid fa-user-plus" aria-hidden="true"></i>Crear proveedor
        </button>
      </div>
      <app-supplier-address-selection [form]="form" />
    </div>
  }
  <div class="purchase-detail-wide">
    <div class="purchase-date-controls" [class.with-delivery]="!!deliveryForm || manageDelivery">
      <div class="purchase-detail-field"><label for="purchase-start"><i class="fa-regular fa-calendar" aria-hidden="true"></i>Fecha de compra</label><input id="purchase-start" formControlName="purchase_start" type="date"></div>
      @if (deliveryForm || manageDelivery) { <div class="purchase-delivery-action"><button type="button" class="purchase-delivery-toggle" [class.active]="deliveryOpen" [attr.aria-expanded]="deliveryOpen" [attr.aria-controls]="manageDelivery ? 'purchase-edit-delivery' : 'purchase-delivery-dates'" (click)="toggleDelivery()"><i class="fa-regular fa-calendar-check" aria-hidden="true"></i>{{ deliveryButtonText }}<i class="fa-solid fa-chevron-down" [class.expanded]="deliveryOpen" aria-hidden="true"></i></button></div> }
    </div>
    @if (deliveryForm; as delivery) { <app-delivery-setup [form]="delivery" /> }
    <ng-content select="[purchase-delivery-panel]" />
  </div>
  <div class="purchase-detail-field purchase-detail-wide">
    <label for="purchase-observations"><i class="fa-regular fa-comment" aria-hidden="true"></i>Observaciones</label>
    <textarea id="purchase-observations" formControlName="observations" rows="3" placeholder="Añade una referencia o indicación sobre esta compra"></textarea>
  </div>
</div>
<ng-template #newSupplier let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Crear proveedor</h4>
    <button type="button" class="btn-close" aria-label="Cerrar" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body pb-4"><app-supplier-create (emitSupplierCreate)="supplierReceiveCreate($event)" /></div>
</ng-template>
