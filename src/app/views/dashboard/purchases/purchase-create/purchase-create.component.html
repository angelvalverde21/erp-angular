<form class="purchase-editor" [formGroup]="form" (ngSubmit)="create()">
  <fieldset class="purchase-editor-content" [disabled]="loadingIcon">
    @if (error) { <div class="purchase-editor-error" role="alert">{{ error }}</div> }
    <section class="purchase-editor-items" aria-label="Conceptos de la compra">
      <app-purchase-item-index [purchase_items]="purchase_items" (emitAddItem)="addItem()"></app-purchase-item-index>
    </section>
    <details class="purchase-editor-options">
      <summary><span><i class="fa-solid fa-sliders" aria-hidden="true"></i>Proveedor y datos adicionales<small>Opcional</small></span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></summary>
      <div class="purchase-editor-options-body">
        @if (supplierError) { <p role="alert">{{ supplierError }} <button type="button" (click)="loadSuppliers()">Reintentar</button></p> }
        <app-purchase-form [form]="form" [suppliers]="suppliers"></app-purchase-form>
      </div>
    </details>
    <div class="purchase-editor-delivery"><app-delivery-setup [form]="$any(form.get('delivery'))"></app-delivery-setup></div>
  </fieldset>
  <footer class="purchase-editor-footer">
    <div><small>Total de la compra · {{ purchase_items.length }} {{ purchase_items.length === 1 ? 'concepto' : 'conceptos' }}</small><strong>{{ totalAmount | currency:'PEN':'symbol':'1.2-2':'es-PE' }}</strong></div>
    <div class="purchase-editor-actions">
      <button type="button" class="purchase-editor-cancel" [disabled]="loadingIcon" (click)="cancelled.emit()">Cancelar</button>
      <button type="submit" class="purchase-editor-save" [disabled]="loadingIcon || form.invalid">
        <i class="fa-solid" [class.fa-spinner]="loadingIcon" [class.fa-spin]="loadingIcon" [class.fa-check]="!loadingIcon" aria-hidden="true"></i>
        {{ loadingIcon ? 'Registrando…' : 'Registrar compra' }}
      </button>
    </div>
  </footer>
</form>
