<ng-container [formGroup]="formGroup">
  <td>
    <input formControlName="quantity" type="number" min="0.01" step="0.01" class="form-control text-end"
      [class.is-invalid]="isInvalid('quantity')" placeholder="0" [attr.aria-label]="'Cantidad del concepto ' + (index + 1)">
  </td>
  <td><app-unit-selected formControlName="unit_id" [class.is-invalid]="isInvalid('unit_id')"></app-unit-selected></td>
  <td>
    <input formControlName="name" type="text" maxlength="255" class="form-control"
      [class.is-invalid]="isInvalid('name')" placeholder="Describe el material o servicio" [attr.aria-label]="'Nombre del concepto ' + (index + 1)">
  </td>
  <td>
    <input formControlName="price" type="number" min="0" step="0.01" class="form-control text-end" twoDecimals
      [class.is-invalid]="isInvalid('price')" placeholder="0.00" [attr.aria-label]="'Precio unitario del concepto ' + (index + 1)">
  </td>
  <td>
    <input formControlName="subtotal" type="number" min="0" step="0.01" class="form-control text-end purchase-item-total" twoDecimals
      [class.is-invalid]="isInvalid('subtotal')" placeholder="0.00" [attr.aria-label]="'Importe del concepto ' + (index + 1)">
  </td>
  <td><button type="button" class="purchase-item-remove" (click)="removeItem()" [attr.aria-label]="'Eliminar concepto ' + (index + 1)"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button></td>
</ng-container>
