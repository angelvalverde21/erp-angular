<form [formGroup]="form" (ngSubmit)="create()" class="option-create-form">
  <label [for]="'new-option-' + product_id">Agregar opción</label>
  <div class="option-create-controls">
    <select class="form-select" [id]="'new-option-' + product_id" [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched" formControlName="name">
      <option value="">Selecciona una opción</option>
      @for (option_init of options_init; track option_init.name) { <option [value]="option_init.name">{{ option_init.label }}</option> }
    </select>
    <button type="submit" class="option-add-button" [disabled]="loading || form.invalid">
      @if (loading) { <span class="spinner-border spinner-border-sm" aria-hidden="true"></span> }
      @else { <i class="fa-solid fa-plus" aria-hidden="true"></i> }
      <span>Agregar</span>
    </button>
  </div>
</form>
