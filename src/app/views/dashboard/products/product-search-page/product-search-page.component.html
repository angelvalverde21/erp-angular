<app-head-page title="Productos">
    <a class="product-primary-action" [routerLink]="['../create']"><i class="fa-solid fa-plus" aria-hidden="true"></i>Agregar producto</a>
</app-head-page>

<div class="card">

    <div class="card-header py-3">

        <app-product-search [term]="params.search || ''" (searchSubmit)="receiveParams($event)"></app-product-search>

    </div>

    <div class="card-body p-0">

        @if (error) { <div class="p-4" role="alert"><p>{{ error }}</p><button type="button" class="btn btn-outline-secondary btn-sm" [disabled]="loading" (click)="initSearch(page)">Reintentar</button></div> }

        @if (loading) {
            <div class="p-4 text-center" role="status"><app-loading></app-loading></div>
        } @else {
            <app-product-index [bulkActions]="true" [products]="products" [insertedProductId]="insertedProductId" (productDuplicated)="insertDuplicate($event)"></app-product-index>
        }

    </div>

    <footer class="product-pagination">
        <span role="status">Página {{ page }} de {{ lastPage }}</span>
        <nav aria-label="Paginación de productos encontrados">
            <button type="button" [disabled]="loading || page <= 1" (click)="changePage(page - 1)"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i>Anterior</button>
            <button type="button" [disabled]="loading || page >= lastPage" (click)="changePage(page + 1)">Siguiente<i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
        </nav>
    </footer>

</div>
