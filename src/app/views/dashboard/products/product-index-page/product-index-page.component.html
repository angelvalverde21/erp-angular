<app-head-page title="Productos">
  <a class="product-primary-action" [routerLink]="['./create']"><i class="fa-solid fa-plus" aria-hidden="true"></i>Agregar producto</a>
</app-head-page>
<section class="card product-catalog-panel">
  <div class="card-header product-search-header"><app-product-search (searchSubmit)="receiveParams($event)"></app-product-search></div>
  <div class="card-body p-0" [attr.aria-busy]="loading">
    <app-product-index [bulkActions]="true" [products]="products" [insertedProductId]="insertedProductId" [sortable]="true" [sortBy]="sortBy" [sortDirection]="sortDirection" [loading]="loading" (productDuplicated)="insertDuplicate($event)" (sortChange)="changeSort($event)"></app-product-index>
    @if (error) { <div class="product-catalog-error" role="alert"><p>{{ error }}</p><button type="button" class="btn btn-outline-secondary btn-sm" (click)="retry()">Reintentar</button></div> }
  </div>
  <footer class="product-pagination">
    <span role="status">Página {{ page }} de {{ lastPage }}</span>
    <nav aria-label="Paginación de productos">
      <button type="button" [disabled]="loading || page <= 1" (click)="changePage(page - 1)"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i>Anterior</button>
      <button type="button" [disabled]="loading || page >= lastPage" (click)="changePage(page + 1)">Siguiente<i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </nav>
  </footer>
</section>
