<app-head-page title="Productos">
  <a class="product-primary-action" [routerLink]="['./create']"><i class="fa-solid fa-plus" aria-hidden="true"></i>Agregar producto</a>
</app-head-page>
<section class="card product-catalog-panel">
  <div class="card-header product-search-header"><app-product-search (searchSubmit)="receiveParams($event)"></app-product-search></div>
  <div class="card-body p-0" [attr.aria-busy]="loading || loadingMore">
    <app-product-index [products]="products" [sortable]="true" [sortBy]="sortBy" [sortDirection]="sortDirection" [loading]="loading" (sortChange)="changeSort($event)" (loadMore)="loadMoreProducts()"></app-product-index>
    @if (loadingMore) { <div class="product-loading-state" role="status"><app-loading></app-loading><p>Cargando más productos...</p></div> }
    @if (error) { <div class="product-catalog-error" role="alert"><p>{{ error }}</p><button type="button" class="btn btn-outline-secondary btn-sm" (click)="retry()">Reintentar</button></div> }
  </div>
  <footer class="product-catalog-footer">
    <span>{{ products.length }} productos cargados@if (total !== null) { de {{ total }} }</span>
    @if (!hasMore && products.length) { <span>Todos los productos cargados</span> }
  </footer>
</section>
