<app-head-page title="Agregar producto" subtitle="Crea la ficha inicial de tu producto y continúa con sus detalles.">
  <a class="product-secondary-action" [routerLink]="['../']"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Volver al catálogo</a>
</app-head-page>


@if (setupLoading) {
  <div class="product-create-loading" role="status"><app-loading></app-loading><span>Preparando el formulario…</span></div>
} @else {
    <app-product-create (emitProductCreate)="receiveProductCreate($event)" [categories]="categories"
      [brands]="brands"></app-product-create>



}
