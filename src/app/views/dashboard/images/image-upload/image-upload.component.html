<ngx-dropzone (change)="onSelect($event)" [multiple]="true" [accept]="acceptedFiles" [maxFileSize]="maxFileSize">

    <ngx-dropzone-label>
        <div class="message">
            <fa-icon [icon]="faFileCirclePlus" class="me-2"></fa-icon>
            <span>Arrastra Imagenes</span>
        </div>
    </ngx-dropzone-label>

    @for (file of images; track file) {
    <ngx-dropzone-image-preview (removed)="onRemove($event)" [file]="file" [removable]="!uploading">
    </ngx-dropzone-image-preview>
    }
</ngx-dropzone>
@if (uploading) { <p class="small text-muted mt-2" role="status">Subiendo imágenes…</p> }
@if (error) { <div class="alert alert-danger mt-2" role="alert">{{ error }}@if (images.length && !uploading) { <button type="button" class="btn btn-sm btn-light ms-2" (click)="retry()">Reintentar</button> }</div> }
