<div [formGroup]="form" class="personnel-grid">
  <label class="personnel-field"><span class="personnel-label">Día de la semana *</span>
    <select class="form-select" formControlName="day_of_week">
      <option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option>
      <option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="7">Domingo</option>
    </select>
  </label>
  <label class="personnel-field"><span class="personnel-label">Modalidad *</span>
    <select class="form-select" formControlName="work_type"><option value="onsite">Presencial</option><option value="home_office">Remoto</option><option value="rest">Descanso</option></select>
  </label>
  <label class="personnel-field"><span class="personnel-label">Entrada</span><input type="time" step="1" class="form-control" formControlName="start_time"></label>
  <label class="personnel-field"><span class="personnel-label">Salida</span><input type="time" step="1" class="form-control" formControlName="end_time"></label>
  <label class="personnel-field personnel-wide"><span class="personnel-label">Horas adicionales</span>
    <select class="form-select" formControlName="allow_extra_hours"><option [ngValue]="true">Permitir horas adicionales</option><option [ngValue]="false">Limitar al horario configurado</option></select>
  </label>
  <label class="personnel-field personnel-wide"><span class="personnel-label">Observaciones</span>
    <textarea class="form-control" rows="3" maxlength="1000" formControlName="comments" placeholder="Indicaciones para este día"></textarea>
  </label>
</div>
