<div class="personnel-filters justify-content-between"><span class="personnel-muted">{{ schedules.length }} días configurados</span>
  <button type="button" class="personnel-button" (click)="openVerticallyCentered(content)"><i class="fa-solid fa-plus" aria-hidden="true"></i>Agregar horario</button>
</div>
<div class="table-responsive">
  <table class="table personnel-table">
    <thead><tr><th>Modalidad</th><th>Día</th><th>Entrada</th><th>Salida</th><th>Horas adicionales</th><th>Observaciones</th><th>Acción</th></tr></thead>
    <tbody>
      @for (schedule of schedules; track schedule.id) {
        <tr [employee_id]="employee_id" app-schedule-index-row [schedule]="schedule" (emitRemoveschedule)="receiveRemoveschedule($event)"></tr>
      } @empty { <tr><td colspan="7"><div class="personnel-empty"><i class="fa-regular fa-clock" aria-hidden="true"></i><strong>Aún no hay horarios</strong><p>Agrega el primer día de la jornada semanal.</p></div></td></tr> }
    </tbody>
  </table>
</div>
<ng-template #content let-modal>
  <div class="modal-header"><h2 class="modal-title fs-5">Agregar horario</h2><button type="button" class="btn-close" aria-label="Cerrar" (click)="modal.dismiss()"></button></div>
  <div class="modal-body p-4"><app-schedule-create [employee_id]="employee_id" (emitCreateSchedule)="receiveCreateSchedule($event)"></app-schedule-create></div>
</ng-template>
