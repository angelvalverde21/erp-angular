<div class="inventory-page ">
  <app-inventory-section-header title="Inventarios" description="Planifica el inventario y organiza el trabajo de tu equipo." [sessions]="false" ><a class="branch-action" [routerLink]="['./create']"><i class="fa-solid fa-plus" aria-hidden="true"></i>Crear inventario</a></app-inventory-section-header>
  <form class="inventory-filter" (submit)="applyFilters($event)"><div class="branch-field search-field"><label for="inventory-search">Buscar inventario</label><input #searchInput id="inventory-search" type="search" placeholder="Nombre del inventario…" [value]="search" (input)="search = searchInput.value" [disabled]="loading"></div><div class="branch-field"><label for="inventory-filter-status">Estado</label><select #statusInput id="inventory-filter-status" [value]="status" (change)="status = statusInput.value" [disabled]="loading"><option value="">Todos los estados</option><option value="draft">Borrador</option><option value="in_progress">En progreso</option><option value="completed">Finalizado</option><option value="cancelled">Cancelado</option></select></div><button type="submit" class="branch-action" [disabled]="loading"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>Buscar</button></form>
  @if (error) { <div class="branch-alert" role="alert">{{ error }} <button class="btn btn-sm btn-outline-secondary ms-2" (click)="load()">Reintentar</button></div> }
  @if (loading) { <div class="branch-state" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>Cargando registros…</div> }
  @else if (!error) { <p class="inventory-caption">{{ total }} inventarios encontrados</p><app-inventory-index [inventories]="inventories"></app-inventory-index> }
  @if (lastPage > 1) { <nav class="branch-pagination" aria-label="Paginación"><button class="branch-back" [disabled]="page <= 1 || loading" (click)="load(page - 1)">Anterior</button><span>{{ page }} de {{ lastPage }}</span><button class="branch-back" [disabled]="page >= lastPage || loading" (click)="load(page + 1)">Siguiente</button></nav> }
</div>
