<div class="inventory-page count-page">
  <app-inventory-section-header [sessions]="true" workspace="counts" [inventory]="inventory" [session]="session" title="Registrar conteo" description="Registra cantidades físicas por variante, ubicación y ronda.">
    <a class="branch-back" [routerLink]="['../']"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Volver al listado</a>
    
  </app-inventory-section-header>
  @if (error) { <div class="branch-alert" role="alert">{{ error }} @if (!inventory) { <button class="btn btn-sm btn-outline-secondary ms-2" (click)="load()">Reintentar</button> }</div> }
  @if (loading) { <div class="branch-state" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>Cargando información…</div> }
  @else if (inventory && options ) {
    @if (!editable) { <p class="workflow-note">El inventario o la sesión están cerrados. Los registros se muestran para consulta.</p> }
    <section class="workspace-form count-workspace"><app-inventory-count-create [options]="options"  [countedQuantity]="countedQuantity" [historyRecords]="historyRecords" [historyLoading]="historyLoading" [historyError]="historyError" [historyTotal]="historyTotal" [historyPage]="historyPage" [historyLastPage]="historyLastPage" (historyPageChange)="loadHistory($event)" [saving]="saving" [readOnly]="!editable"  [variants]="variants" [searching]="searching" [searchError]="searchError" (searchVariants)="searchVariants($event)" (save)="save($event)" ></app-inventory-count-create></section>
  }
  
</div>
