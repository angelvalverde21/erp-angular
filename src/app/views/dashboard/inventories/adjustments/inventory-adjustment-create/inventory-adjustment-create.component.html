<form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="saving"><fieldset class="branch-form border-0 m-0" [disabled]="saving || readOnly"><div class="branch-field"><label>Variante *</label><app-inventory-variant-picker [variants]="variants" [selected]="selectedVariant" [loading]="searching" [error]="searchError" [disabled]="saving || readOnly" [invalid]="form.controls.variant_id.invalid && form.controls.variant_id.touched" (search)="searchVariants.emit($event)" (choose)="chooseVariant($event)"></app-inventory-variant-picker></div><p class="count-explanation">El stock del sistema, el total físico vigente y la diferencia se calcularán en el servidor. Requiere conteos físicos para esta variante.</p><div class="branch-field"><label for="adjustment-comment">Observaciones (opcional)</label><textarea id="adjustment-comment" formControlName="comment" maxlength="5000" placeholder="Motivo o información para la revisión"></textarea></div>@if (form.invalid && form.touched) { <p class="branch-validation" role="alert">Revisa los campos marcados en rojo.</p> }</fieldset><div class="branch-form branch-form-actions"><a class="branch-back" [routerLink]="cancelPath" [class.disabled]="saving">Volver al listado</a>@if (!readOnly) { <button class="branch-action" type="submit" [disabled]="saving">@if (saving) { <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>Guardando… } @else { <i class="fa-solid fa-check" aria-hidden="true"></i>{{ editing ? 'Guardar cambios' : 'Calcular ajuste' }} }</button> }</div></form>
