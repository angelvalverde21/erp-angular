<div class="inventory-page session-page">
  <app-inventory-section-header [sessions]="true" [inventory]="inventory" title="Abrir sesión" description="Organiza el trabajo y registra a su responsable."><a class="branch-back" [routerLink]="['../']"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>Volver al listado</a></app-inventory-section-header>
  @if (error) { <div class="branch-alert" role="alert">{{ error }} @if (!options) { <button type="button" class="btn btn-sm btn-outline-secondary ms-2" (click)="load()">Reintentar</button> }</div> }
  @if (loading) { <div class="branch-state" role="status"><span class="spinner-border spinner-border-sm" aria-hidden="true"></span>Cargando información…</div> }
  @else if (options  && inventory && (inventory.status === 'draft' || inventory.status === 'in_progress')) { <section class="branch-panel inventory-form-panel"><app-inventory-session-create [options]="options" [workspaceOptions]="workspaceOptions" [inventory]="inventory" [saving]="saving"  [defaultUserId]="options?.current_user_id || 0" (save)="save($event)"></app-inventory-session-create></section> }
</div>
