<div class="table-responsive" tabindex="0" role="region" aria-label="Listado de órdenes de compra">
  <table class="table table-hover mb-0 align-middle production-table">
    <caption class="visually-hidden">Órdenes de compra, unidades y fechas</caption>
    <thead><tr>
      <th scope="col">Orden de compra</th>
      <th scope="col" class="text-end">Unidades pedidas</th>
      <th scope="col" class="text-end">Recibidas</th>
      <th scope="col">Entrega prevista</th>
      <th scope="col">Creación</th>
      <th scope="col" class="text-end">Acciones</th>
    </tr></thead>
    <tbody>
      @for (manufacture of manufactures; track manufacture.id) {
      <tr app-manufacture-order-index-row [manufacture]="manufacture"></tr>
      }
    </tbody>
  </table>
</div>
