<div class="production-name-form" [formGroup]="form">
  <label for="production-name" class="form-label fw-semibold">Nombre de la producción <span class="text-danger" aria-hidden="true">*</span></label>
  <input id="production-name" formControlName="name" type="text" class="form-control form-control-lg"
    placeholder="Ej.: Colección verano · Primer lote" [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched"
    aria-required="true" aria-describedby="production-name-help production-name-error" />
  <p id="production-name-help" class="production-meta mt-2 mb-0">Usa un nombre que te permita identificar fácilmente esta fabricación.</p>
  @if (form.get('name')?.invalid && form.get('name')?.touched) { <p id="production-name-error" class="text-danger small mt-2 mb-0" role="alert">Ingresa un nombre para la producción.</p> }
</div>
