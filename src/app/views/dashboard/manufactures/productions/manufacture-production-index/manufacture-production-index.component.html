<div class="table-responsive" tabindex="0" role="region" aria-label="Listado de producciones">
  <table class="table table-hover mb-0 align-middle production-table">
    <caption class="visually-hidden">Producciones, cantidades, costos y fechas de actualización</caption>
    <thead><tr>
      <th scope="col">Producción</th>
      <th scope="col" class="text-end">Unidades planificadas</th>
      <th scope="col" class="text-end">Recibidas</th>
      <th scope="col" class="text-end">Costo por unidad</th>
      <th scope="col" class="text-end">Gasto total</th>
      <th scope="col">Actualización</th>
      <th scope="col" class="text-end">Acciones</th>
    </tr></thead>
    <tbody>
      @for (production of productions; track production.id) {
      <tr app-manufacture-production-index-row [production]="production"></tr>
      }
    </tbody>
  </table>
</div>
