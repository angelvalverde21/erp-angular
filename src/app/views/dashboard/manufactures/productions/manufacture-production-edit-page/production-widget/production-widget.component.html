<nav class="production-navigation" aria-label="Secciones de la producción">
  @for (widget of widgets; track widget.title) {
  <a class="production-metric" [routerLink]="widget.link" routerLinkActive="production-metric-active"
    [routerLinkActiveOptions]="{ exact: widget.exact ?? false }" ariaCurrentWhenActive="page">
    <div class="production-metric-label"><span><fa-icon [icon]="widget.icon" aria-hidden="true"></fa-icon>{{ widget.title }}</span><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></div>
    <strong>{{ widget.type === 'currency' ? (widget.value | pen) : widget.value }}</strong>
    <span class="production-metric-subtitle">{{ widget.subtitle }}</span>
  </a>
  }
</nav>
