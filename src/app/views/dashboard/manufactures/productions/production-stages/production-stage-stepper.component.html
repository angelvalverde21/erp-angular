<section class="stage-flow" aria-label="Etapas de producción">
  <header>
    <div><h2>Etapas de producción</h2><p>Selecciona una etapa para ver y completar sus datos.</p></div>
    <div class="stage-flow-actions">
      <button type="button" class="stage-configure" (click)="configure.emit()"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Configurar secciones</button>
      @if (selectedIndex >= 0) { <span class="stage-context">Etapa {{ selectedIndex + 1 }} de {{ stages.length }}</span> }
      @if (otherExpenses; as expenses) {
        <button type="button" class="stage-other-expenses" [class.active]="selectedId === expenses.id"
          [attr.aria-pressed]="selectedId === expenses.id" [attr.aria-label]="'Otros gastos: ' + expenses.count + ' registros'"
          (click)="choose.emit(expenses.id)">Otros gastos <span>{{ expenses.count }}</span></button>
      }
    </div>
  </header>
  <nav class="stage-stepper" aria-label="Seleccionar etapa de producción">
    @for (stage of stages; track stage.id; let index = $index) {
      <button type="button" class="stage-step stage-step-link" [class.completed]="stage.status === 'completed'"
        [class.in_progress]="stage.status === 'in_progress'" [class.selected]="selectedId === stage.id" [class.locked]="stage.locked"
        [attr.aria-current]="selectedId === stage.id ? 'step' : null"
        [attr.aria-label]="stage.name + ': ' + (stage.locked ? (stage.lock_reason || 'Sección no disponible.') : labels[stage.status])"
        [title]="stage.locked ? (stage.lock_reason || 'Sección no disponible.') : stage.name" (click)="choose.emit(stage.id)">
        <span class="step-heading">
          <span class="step-number" aria-hidden="true"><i [class]="stageIcons[stage.code || ''] || 'fa-solid fa-layer-group'"></i></span>
          <span class="step-title"><span class="step-order">{{ index + 1 < 10 ? '0' : '' }}{{ index + 1 }}</span><strong>{{ stage.code === 'reception' ? 'Recepción' : stage.name }}</strong></span>
          <i class="step-open fa-solid fa-chevron-right" aria-hidden="true"></i>
        </span>
        <span class="step-summary">
          <span class="step-status"><i class="fa-solid" [class.fa-lock]="stage.locked" [class.fa-check]="!stage.locked && stage.status === 'completed'" [class.fa-circle]="!stage.locked && stage.status !== 'completed'" aria-hidden="true"></i><span class="step-status-full">{{ stage.locked ? 'Bloqueada' : labels[stage.status] }}</span><span class="step-status-short" aria-hidden="true">{{ stage.locked ? 'Bloqueada' : shortLabels[stage.status] }}</span></span>
          @if (stage.code === 'reception') { <span class="step-detail">Mercadería</span> }
          @else { <span class="step-purchase-count" [class.count-unavailable]="stage.purchases_count == null">{{ stage.purchases_count }} {{ stage.purchases_count === 1 ? 'compra' : 'compras' }}</span> }
        </span>
        @if (overdue(stage)) { <span class="step-overdue">Entrega atrasada</span> }
      </button>
    }
  </nav>
  <ng-content></ng-content>
</section>
