@if (!payments.length) { <app-void-index /> } @else {
<div class="payment-list-scroll"><table class="payment-list-table">
<thead><tr><th scope="col">Fecha</th><th scope="col">Concepto / movimiento</th><th scope="col">Medio de pago</th><th scope="col">Comprobante</th><th scope="col" class="payment-amount-cell">Importe</th><th scope="col">Acciones</th></tr></thead>
<tbody>@for (payment of payments; track payment.id) { <tr app-payment-index-row [payment]="payment" [edit]="false"></tr> }</tbody>
<tfoot><tr><th colspan="4" scope="row">Total</th><td class="payment-amount-cell"><strong>S/ {{ sum_payments.toFixed(2) }}</strong></td><td class="payment-total-spacer"></td></tr></tfoot>
</table></div>
}
