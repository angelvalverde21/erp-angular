<select class="form-select" aria-label="Unidad de medida" [ngModel]="value" [disabled]="disabled || loading || !units.length" [attr.aria-busy]="loading" (change)="onUnitChange($event)" (blur)="onTouched()">
  <option value="">{{ loading ? 'Cargando…' : 'Seleccione' }}</option>
  @for (unit of units; track unit.id) { <option [value]="unit.id">{{ unit.name }}</option> }
</select>
@if (error) { <div class="unit-load-error" role="alert"><span>{{ error }}</span><button type="button" [disabled]="disabled || loading" (click)="load()">Reintentar</button></div> }
