<form [formGroup]="form">
    <div class="row">

        <!-- {{ addressForm.valid }} -->

        <div class="col-lg-12 col-12">
            <app-input-group [icon]="faUser" text="">
                <input formControlName="name" type="text" inputmode="numeric" class="form-control is-required"
                    [ngClass]="isInvalid('name') ? 'is-invalid' : ''" placeholder="* Nombre completo" aria-label="name"
                    aria-describedby="Nombre completo">
            </app-input-group>
        </div>


        <div class="col-lg-6 col-md-6 col-6">
            <!-- <label for="identity_id" class="mb-2">Tipo de documento</label> -->
            <app-identity-selected formControlName="identity_id"></app-identity-selected>
        </div>

        <div class="col-lg-6 col-md-6 col-6">
            <app-input-group>
                <input formControlName="document_number" type="text" class="form-control"
                    placeholder="Numero de documento" [ngClass]="isInvalid('document_number') ? 'is-invalid' : '' "
                    aria-label="document_number" aria-describedby="Documento nacional de identidad">
            </app-input-group>
        </div>

        <div class="col-lg-12 col-12">
            <app-input-group [icon]="faPhone">
                <input type="number" class="form-control is-required"
                    [ngClass]="isInvalid('phone') ? 'is-invalid' : '' " placeholder="* Celular" formControlName="phone"
                    required />
            </app-input-group>

        </div>

        <div class="col-lg-6 col-12">
            <app-input-group [icon]="faLocationDot">
                <input formControlName="primary" type="text" class="form-control is-required"
                    [ngClass]="isInvalid('primary') ? 'is-invalid' : '' " placeholder="* Direccion Principal"
                    aria-label="address" aria-describedby="Direccion Principal">
            </app-input-group>
        </div>


        <div class="col-lg-6 col-12">
            <app-input-group>
                <input formControlName="secondary" type="text" [ngClass]="isInvalid('secondary') ? 'is-invalid' : '' "
                    class="form-control" placeholder="Direccion Secundaria" aria-label="address"
                    aria-describedby="Direccion Secundaria">
            </app-input-group>
        </div>

        <div class="col-lg-12 col-12">
            <app-input-district-id formControlName="district_id"
                [isInvalid]="isInvalid('district_id')"></app-input-district-id>
        </div>

        <div class="col-lg-12 col-12">
            <textarea id="" formControlName="references" [ngClass]="isInvalid('references') ? 'is-invalid' : '' "
                class="form-control mb-3" placeholder="Referencia"></textarea>
        </div>
        <!-- {{ form.value | json }} -->

    </div>

</form>
