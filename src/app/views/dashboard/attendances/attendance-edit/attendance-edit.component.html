<form [formGroup]="form" (ngSubmit)="createOrUpdate()" class="personnel-form">
  <div class="personnel-grid">
    <div class="personnel-field personnel-wide"><label>Empleado *</label>
      <app-employee-selected formControlName="employee_id"></app-employee-selected>
      @if (form.controls['employee_id'].touched && form.controls['employee_id'].invalid) { <small class="text-danger">Selecciona un empleado.</small> }
    </div>
    <label class="personnel-field personnel-wide"><span class="personnel-label">Fecha *</span>
      <input class="form-control" type="date" formControlName="date" required>
    </label>
    <label class="personnel-field"><span class="personnel-label">Entrada</span><input class="form-control" type="time" step="1" formControlName="check_in"></label>
    <label class="personnel-field"><span class="personnel-label">Salida</span><input class="form-control" type="time" step="1" formControlName="check_out">
      <small>Puedes dejarla vacía si falta la marcación.</small>
    </label>
    <label class="personnel-field personnel-wide"><span class="personnel-label">Observación</span>
      <textarea class="form-control" rows="3" maxlength="250" formControlName="comment" placeholder="Motivo del registro o de la corrección"></textarea>
    </label>
  </div>
  <div class="personnel-card-footer px-0 pb-0 mt-3">
    @if (error) { <p class="personnel-error" role="alert">{{ error }}</p> }
    <button class="personnel-button personnel-primary" type="submit" [disabled]="loading">
      @if (loading) { <span class="spinner-border spinner-border-sm" aria-hidden="true"></span> }
      @else { <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> }
      {{ loading ? 'Guardando…' : 'Guardar asistencia' }}
    </button>
  </div>
</form>
