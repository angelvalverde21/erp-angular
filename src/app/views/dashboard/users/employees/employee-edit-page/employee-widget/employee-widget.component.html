<nav class="personnel-tabs" aria-label="Secciones del empleado">
  @for (section of sections; track section.path) {
    <a [routerLink]="section.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: section.exact}">
      <i class="fa-solid" [class]="section.icon" aria-hidden="true"></i>{{ section.title }}
    </a>
  }
</nav>
