<section class="personnel-card mb-3">
  <header class="personnel-card-header">
    <div><h2>Asistencias del empleado</h2><p>Consulta un período o registra una marcación manual.</p></div>
    <button class="personnel-button personnel-primary" type="button" (click)="openVerticallyCentered(content)"><i class="fa-solid fa-plus" aria-hidden="true"></i>Registrar asistencia</button>
  </header>
  <div class="personnel-card-body pb-0">
    <app-head-search type="employee_attendance" [box_search]="false" [show_date]="true" [is_redirect]="false"
      (emitSearchResult)="receiveAttendances($event)"></app-head-search>
  </div>
  @if (loading) { <div class="personnel-empty" role="status"><span class="spinner-border spinner-border-sm"></span>Cargando asistencias…</div> }
  @else { <app-attendance-index [attendances]="attendances" [employee]="employee"></app-attendance-index> }
</section>
<ng-template #content let-modal>
  <div class="modal-header"><h2 class="modal-title fs-5">Registrar asistencia</h2><button type="button" class="btn-close" aria-label="Cerrar" (click)="modal.dismiss()"></button></div>
  <div class="modal-body p-4"><app-attendance-create [employee_id]="employee_id" (emitAttendanceCreate)="receiveAttendanceCreate($event)"></app-attendance-create></div>
</ng-template>
