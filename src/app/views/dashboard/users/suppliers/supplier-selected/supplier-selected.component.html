<ng-select
  [items]="options" bindLabel="name" bindValue="id"
  [labelForId]="labelForId" [clearable]="true" [loading]="loading"
  [disabled]="isDisabled || loading" [ngModel]="supplier_id"
  [ngModelOptions]="{standalone: true}" (ngModelChange)="setSupplier($event)" (blur)="touch()"
  placeholder="Busca y selecciona un proveedor" loadingText="Cargando proveedores…"
  notFoundText="No se encontraron proveedores" clearAllText="Quitar proveedor">
  <ng-template ng-option-tmp let-item="item">
    <div class="supplier-option"><strong>{{ item.name }}</strong>@if (item.detail) { <small>{{ item.detail }}</small> }</div>
  </ng-template>
  <ng-template ng-label-tmp let-item="item"><span>{{ item.name }}</span></ng-template>
</ng-select>
