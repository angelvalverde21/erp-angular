<main class="contact-page">
  <header class="contact-page-header"><div class="contact-page-title"><span class="contact-page-icon"><i class="fa-solid fa-building" aria-hidden="true"></i></span><div><span class="contact-eyebrow">Directorio · Usuarios</span><h1>Proveedores</h1><p>Organiza tus proveedores y consulta sus datos de contacto.</p></div></div><a class="contact-button dark" routerLink="create"><i class="fa-solid fa-plus" aria-hidden="true"></i>Nuevo proveedor</a></header>
  @if (error) { <div class="contact-alert" role="alert"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>{{ error }}<button class="contact-button light" type="button" (click)="load()">Reintentar</button></div> }
  @if (loading) { <div class="contact-panel contact-feedback" role="status"><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>Cargando proveedores…</div> }
  @else if (!error) { <app-supplier-index [suppliers]="suppliers" /> }
</main>
