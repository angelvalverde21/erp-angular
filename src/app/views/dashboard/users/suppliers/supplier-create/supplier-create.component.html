<form class="contact-editor" [formGroup]="form" (ngSubmit)="submit()">
  @if (error) { <div class="contact-alert" role="alert"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>{{ error }}</div> }
  @if (success) { <div class="contact-success" role="status"><i class="fa-solid fa-check" aria-hidden="true"></i> {{ success }}</div> }
  <fieldset [disabled]="loadingIcon"><app-address-form presentation="supplier" /></fieldset>
  <footer class="contact-editor-footer"><span><i class="fa-solid fa-circle-info" aria-hidden="true"></i> Los campos con * son obligatorios.</span><button type="submit" class="contact-button dark" [disabled]="disabledButton"><i class="fa-solid" [class.fa-spinner]="loadingIcon" [class.fa-spin]="loadingIcon" [class.fa-check]="!loadingIcon" aria-hidden="true"></i>{{ loadingIcon ? 'Guardando…' : button_text || 'Crear proveedor' }}</button></footer>
</form>
